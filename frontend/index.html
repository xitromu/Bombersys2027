<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOMBERSYS</title>
  <link rel="icon" href="assets/icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100vw; height: 100vh; }
    /* Кнопки страницы — одной строкой в нижней полосе правой панели, под карточками героев.
       Место и размер шрифта ставит main.js по размеру холста игры; остальные размеры — в долях шрифта. */
    #buttons {
      position: fixed; z-index: 10; display: flex; gap: 0.3em; white-space: nowrap;
      transform: translate(-50%, -50%); visibility: hidden;
    }
    #buttons button {
      padding: 0.35em 0.6em; font: 1em Arial, sans-serif; color: #f6e7bd;
      background: rgba(18, 13, 10, 0.55); border: 1px solid #8a6a33; border-radius: 0.4em;
      cursor: pointer; opacity: 0.8;
    }
    #buttons button:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="buttons">
    <button id="volume-down" type="button" tabindex="-1" title="Тише (клавиша −)">−</button>
    <button id="sound" type="button" tabindex="-1" title="Звук и музыка (клавиша M)"></button>
    <button id="volume-up" type="button" tabindex="-1" title="Громче (клавиша +)">+</button>
    <button id="fullscreen" type="button" tabindex="-1" title="На весь экран">⛶</button>
  </div>
  <!-- Phaser — движок 2D-игр; лежит в проекте, чтобы игра работала без интернета -->
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
