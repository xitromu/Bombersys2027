[project]
name = "bombersys"
version = "0.4.0"
description = "Bomberman 2005 года, возрождённый: игровой сервер на Python и браузерный клиент"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
bombersys = "app.main:run"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
